name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"    # twice a day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gen
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%2339d3c3&color_dots=%23161b22,%230b3b39,%2312716c,%2322b3a8,%2339d3c3
            dist/snake-light.svg?palette=github-light&color_snake=%231f938c&color_dots=%23ebedf0,%23a5e8e1,%235ccabd,%232bb6ac,%2312716c

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}