name: Refresh profile data

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements-daily.txt
      - run: python tools/pull_contributions.py
      - name: Pull stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/pull_stats.py
      - run: python tools/render_graph.py
      - run: python tools/render_stats.py
      - run: python tools/render_langs.py
      - run: python tools/render_trophies.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: refresh profile data [skip ci]"
          file_pattern: "assets/contributions.json assets/stats.json graph.svg stats.svg langs.svg trophies.svg"