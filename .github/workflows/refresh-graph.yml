name: Refresh contribution graph

on:
  schedule:
    - cron: "0 5 * * *"      # once a day, ~05:00 UTC
  workflow_dispatch: {}       # lets you run it manually from the Actions tab

permissions:
  contents: write             # allows the job to commit the updated graph

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements-daily.txt
      - run: python tools/pull_contributions.py
      - run: python tools/render_graph.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: refresh contribution graph [skip ci]"
          file_pattern: "assets/contributions.json graph.svg"